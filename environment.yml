name: spectrome
channels:
  - conda-forge
dependencies:
  # The legacy deepdish dependency requires NumPy < 2.
  - python=3.11
  - pip
  - matplotlib=3.7
  - numpy=1.26
  - scipy=1.11
  - pandas=2.1
  - scikit-learn=1.3
  - nitime
  - tqdm
  - jupyter
  - ipykernel
  - pytest>=8,<9
  # Keep Torch and numerical libraries on the same Conda OpenMP runtime.
  - pytorch>=2.2,<3
#  - nose # for unit testing
#  - nodejs==11.9.0
#  - ipywidgets
#  - vtk==8.1.1
  - pip:
#    - emcee==3.0rc2
#    - great-expectations
#    - mayavi
#    - nibabel
#    - PyQt5
#    - pysurfer
    - deepdish==0.3.7
